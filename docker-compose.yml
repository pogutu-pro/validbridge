services:
  db:
    image: postgres:16-alpine
    container_name: validbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-validbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-validbridge}
      POSTGRES_DB: ${POSTGRES_DB:-validbridge}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-validbridge}"]
      interval: 5s
      timeout: 4s
      retries: 5

  redis:
    image: redis:7.2.3-alpine
    container_name: validbridge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: validbridge-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
      - VALIDBRIDGE_PORT=9000
      - VALIDBRIDGE_SQL_CONNECTION_STRING=postgresql://${POSTGRES_USER:-validbridge}:${POSTGRES_PASSWORD:-validbridge}@db:5432/${POSTGRES_DB:-validbridge}
      - VALIDBRIDGE_REDIS_CONNECTION_STRING=redis://redis:6379/validbridge
    ports:
      - "8000:9000"
    volumes:
      - content_data:/app/content
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: validbridge-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_VALIDBRIDGE_API_URL=http://localhost:8000/api/v1/
      - NEXT_PUBLIC_VALIDBRIDGE_BACKEND_URL=http://localhost:8000/
      - NEXT_PUBLIC_VALIDBRIDGE_DOMAIN=localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db_data:
  redis_data:
  content_data:
