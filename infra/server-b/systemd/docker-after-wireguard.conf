# /etc/systemd/system/docker.service.d/10-after-wireguard.conf
#
# Containers publish ports on the WireGuard IP (10.66.0.2). If Docker starts
# before wg0 exists, that bind fails at boot ("cannot assign requested address")
# and the service stays down. This makes Docker wait for the tunnel.
#
#   sudo mkdir -p /etc/systemd/system/docker.service.d
#   sudo cp docker-after-wireguard.conf /etc/systemd/system/docker.service.d/10-after-wireguard.conf
#   sudo systemctl daemon-reload
[Unit]
Wants=wg-quick@wg0.service
After=wg-quick@wg0.service
